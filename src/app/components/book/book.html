<div class="book">
    <h3>{{ book.title }}</h3>
    <p><strong>Autore:</strong> {{ book.author }}</p>
    <p><strong>Genere:</strong> {{ book.genre }}</p>
    <p><strong>Pagine:</strong> {{ book.pages }}</p>
    <p><strong>ISBN:</strong> {{ book.isbn }}</p>
    <p><strong>Disponibile:</strong> {{ book.available ? 'Sì' : 'No' }}</p>

    <div class="stars"  *ngIf="book.score !== undefined">
        <ng-container *ngFor="let star of getStarsArray(book.score)">
            <span *ngIf="star === 'full'" class="star full">★</span>
            <span *ngIf="star === 'half'" class="star half">☆</span>
            <span *ngIf="star === 'empty'" class="star empty">☆</span>
        </ng-container>
    </div>
</div>
