<div class="book-item" [ngStyle]="{ 'background-color': book()?.available ? 'green' : 'red' }">
  <h4>{{ book()?.title }}</h4>

  @for(star of scoreArray; track $index){ ★ }
  @if(scoreHalf){ ⯪ }

  <p>Author: {{ book()?.author }}</p>
  <p>ISBN: {{ book()?.isbn }}</p>

  @if(book()?.available){ <p class="available">Available</p> }
  @else{ <p class="not-available">Not Available</p> }

  <button (click)="editBook()">Edit</button>
  <button (click)="deleteBook()">Delete</button>
</div>
