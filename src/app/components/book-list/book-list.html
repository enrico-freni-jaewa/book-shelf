<div class="flex flex-col pl-0.5 pr-0.5 gap-2">

  <div class="pl-2">
  <h3 class="text-3xl">Book list</h3>

  <button class="bg-blue-600 rounded-2xl text-white p-2 w-fit" (click)="addBook()">Add book</button>
  </div>
  @for (book of books(); track book.id) {
    <div class="w-full">
      <app-book (onDelete)="deleteBook($event)" [book]="book"></app-book>
    </div>
  }
</div>
